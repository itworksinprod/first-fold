name: Check free paper quality (no email)
# Reports only safe stage/count annotations; no paper or source text is published.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/personal-quality-check.yml']

permissions: {}

concurrency:
  group: personal-morning-paper
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'itworksinprod/first-fold' && github.ref == 'refs/heads/main' && github.actor == 'itworksinprod'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Test contracts before using credentials
        run: npm test
      - name: Research, draft, check evidence and render without sending
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
        run: node scripts/automation/check-personal-quality.mjs
