name: Test saved article summary (encrypted, no email)
on:
  workflow_dispatch:
    inputs:
      public_key:
        description: Ephemeral RSA-3072 public key in base64 DER format (never a private key)
        required: true
        type: string
      packet_sha256:
        description: SHA-256 of the independently inspected saved-source packet
        required: true
        type: string
permissions: {}
concurrency:
  group: personal-morning-paper
  cancel-in-progress: false
jobs:
  trial:
    if: github.repository == 'itworksinprod/first-fold' && github.ref == 'refs/heads/main' && github.actor == 'itworksinprod' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Test source-neutral boundaries without credentials
        run: node --test tests/article-summary-trial.test.mjs tests/isolated-preservation-review.test.mjs tests/free-workers-ai.test.mjs tests/private-writer-diagnostic.test.mjs
      - name: Validate saved input before provider credentials
        env:
          FIRST_FOLD_ARTICLE_TRIAL_B64: ${{ secrets.FIRST_FOLD_ARTICLE_TRIAL_B64 }}
          ARTICLE_PACKET_SHA256: ${{ inputs.packet_sha256 }}
          DIAGNOSTIC_PUBLIC_KEY: ${{ inputs.public_key }}
        run: node scripts/automation/article-summary-trial.mjs validate
      - name: Write and check one saved article without delivery
        env:
          FIRST_FOLD_ARTICLE_TRIAL_B64: ${{ secrets.FIRST_FOLD_ARTICLE_TRIAL_B64 }}
          ARTICLE_PACKET_SHA256: ${{ inputs.packet_sha256 }}
          DIAGNOSTIC_PUBLIC_KEY: ${{ inputs.public_key }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
        run: node scripts/automation/article-summary-trial.mjs run "$RUNNER_TEMP/article-summary-trial.encrypted.json"
      - name: Retain only encrypted result for one day
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: article-summary-trial
          path: ${{ runner.temp }}/article-summary-trial.encrypted.json
          retention-days: 1
          if-no-files-found: ignore
