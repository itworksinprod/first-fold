name: Send requested free-paper preview
# Owner-requested September 11 preview, researched September 12. Manual only;
# expires at the end of September 12 Eastern. Never replaces a daily edition.
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: personal-morning-paper
  cancel-in-progress: false
jobs:
  preview:
    if: github.repository == 'itworksinprod/first-fold' && github.ref == 'refs/heads/main' && github.actor == 'itworksinprod' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Test before using credentials
        run: npm test
      - name: Research, check every summary, and send the requested preview once
        env:
          PREVIEW_CONFIRMATION: SEND SEPTEMBER 11 PREVIEW 2026-09-12
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TAVILY_PAYGO_DISABLED_VERIFIED: ${{ vars.TAVILY_PAYGO_DISABLED_VERIFIED }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PERSONAL_PAPER_EMAIL: ${{ secrets.PERSONAL_PAPER_EMAIL }}
        run: node scripts/automation/personal-preview.mjs
