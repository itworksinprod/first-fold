name: Measure blinded source-review obligations v2 (encrypted, no email)
on:
  workflow_dispatch:
    inputs:
      public_key:
        description: Ephemeral RSA-3072 public key in base64 DER format (never a private key)
        required: true
        type: string
      scope_witnesses:
        description: Select the separately reviewed v3 scope-witness experiment (v2 remains the default)
        required: true
        default: false
        type: boolean
permissions: {}
concurrency:
  group: personal-morning-paper
  cancel-in-progress: false
jobs:
  review:
    if: github.repository == 'itworksinprod/first-fold' && github.ref == 'refs/heads/main' && github.actor == 'itworksinprod' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Test frozen subset and blinded stages without credentials
        run: node --test tests/split-passage*.test.mjs tests/split-scope-witness*.test.mjs tests/joint-passage*.test.mjs tests/free-workers-ai.test.mjs tests/private-writer-diagnostic.test.mjs
      - name: Validate selected frozen subset and key before provider credentials
        env:
          DIAGNOSTIC_PUBLIC_KEY: ${{ inputs.public_key }}
          SCOPE_WITNESSES: ${{ inputs.scope_witnesses }}
        run: |
          if [[ "$SCOPE_WITNESSES" == "true" ]]; then
            node scripts/automation/split-passage-live.mjs validate-scope-witnesses
          elif [[ "$SCOPE_WITNESSES" == "false" ]]; then
            node scripts/automation/split-passage-live.mjs validate-obligations
          else
            exit 1
          fi
      - name: Measure two selected blinded stages per fictional case once
        env:
          DIAGNOSTIC_PUBLIC_KEY: ${{ inputs.public_key }}
          SCOPE_WITNESSES: ${{ inputs.scope_witnesses }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
        run: |
          if [[ "$SCOPE_WITNESSES" == "true" ]]; then
            node scripts/automation/split-passage-live.mjs run-scope-witnesses "$RUNNER_TEMP/split-passage-live.encrypted.json"
          elif [[ "$SCOPE_WITNESSES" == "false" ]]; then
            node scripts/automation/split-passage-live.mjs run-obligations "$RUNNER_TEMP/split-passage-live.encrypted.json"
          else
            exit 1
          fi
      - name: Retain only encrypted result for one day
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: split-passage-live
          path: ${{ runner.temp }}/split-passage-live.encrypted.json
          retention-days: 1
          if-no-files-found: ignore
