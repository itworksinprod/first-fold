name: Draft Flash-Lite sample for human review (no email)
on:
  workflow_dispatch:
    inputs:
      free_project_confirmation:
        description: Confirm AI Studio shows Free and no billing account is linked; enter FREE PROJECT BILLING DISABLED
        required: true
        type: string
permissions: {}
concurrency:
  group: gemini-writer-qualification
  cancel-in-progress: false
jobs:
  preview:
    if: >-
      github.repository == 'itworksinprod/first-fold' &&
      github.ref == 'refs/heads/main' && github.actor == 'itworksinprod' &&
      github.run_attempt == 1 && inputs.free_project_confirmation == 'FREE PROJECT BILLING DISABLED'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Test draft isolation and escaping
        run: node --test tests/gemini-human-preview.test.mjs tests/gemini-ai.test.mjs
      - name: Draft one unapproved offline-evidence sample
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FREE_PROJECT_CONFIRMATION: ${{ inputs.free_project_confirmation }}
        run: node scripts/automation/preview-gemini-lite.mjs --human-review-only "$RUNNER_TEMP/unapproved-sample.html" > "$RUNNER_TEMP/human-preview-report.json"
      - name: Retain unapproved sample and diagnostic report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unapproved-flash-lite-sample
          path: |
            ${{ runner.temp }}/unapproved-sample.html
            ${{ runner.temp }}/human-preview-report.json
          retention-days: 1
          if-no-files-found: ignore
