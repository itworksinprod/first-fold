name: Send exact independently reviewed email test
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: first-fold-reviewed-email-test
  cancel-in-progress: false
jobs:
  reviewed-test:
    if: >-
      github.repository == 'itworksinprod/first-fold' &&
      github.ref == 'refs/heads/main' && github.actor == 'itworksinprod' &&
      github.triggering_actor == 'itworksinprod' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Test before credentials
        run: npm test
      - name: Decrypt, validate full review, and recheck publisher sources without email credentials
        env:
          FIRST_FOLD_REVIEWED_TEST_KEY: ${{ secrets.FIRST_FOLD_REVIEWED_TEST_KEY }}
        run: node scripts/automation/reviewed-email-test.mjs --validate
      - name: Revalidate and send the exact reviewed test once
        env:
          FIRST_FOLD_REVIEWED_TEST_KEY: ${{ secrets.FIRST_FOLD_REVIEWED_TEST_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PERSONAL_PAPER_EMAIL: ${{ secrets.PERSONAL_PAPER_EMAIL }}
        run: node scripts/automation/reviewed-email-test.mjs --send
