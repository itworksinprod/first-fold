name: Measure joint-source inference (encrypted, no email)
on:
  workflow_dispatch:
    inputs:
      public_key:
        description: Ephemeral RSA-3072 public key in base64 DER format (never a private key)
        required: true
        type: string
permissions: {}
concurrency:
  group: personal-morning-paper
  cancel-in-progress: false
jobs:
  review:
    if: github.repository == 'itworksinprod/first-fold' && github.ref == 'refs/heads/main' && github.actor == 'itworksinprod' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Test frozen controls and request boundaries without credentials
        run: node --test tests/joint-passage-live.test.mjs tests/joint-passage-calibration.test.mjs tests/joint-passage-review.test.mjs tests/source-sentence-review.test.mjs tests/span-source-review.test.mjs tests/free-workers-ai.test.mjs tests/private-writer-diagnostic.test.mjs
      - name: Validate frozen corpus and key before provider credentials
        env:
          DIAGNOSTIC_PUBLIC_KEY: ${{ inputs.public_key }}
        run: node scripts/automation/joint-passage-live.mjs validate
      - name: Measure each fictional scope case once
        env:
          DIAGNOSTIC_PUBLIC_KEY: ${{ inputs.public_key }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
        run: node scripts/automation/joint-passage-live.mjs run "$RUNNER_TEMP/joint-passage-live.encrypted.json"
      - name: Retain only encrypted result for one day
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: joint-passage-live
          path: ${{ runner.temp }}/joint-passage-live.encrypted.json
          retention-days: 1
          if-no-files-found: ignore
