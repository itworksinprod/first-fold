name: Inspect free paper draft privately (no email)
# Manual, encrypted diagnostic only. It cannot send or publish a paper.
on:
  workflow_dispatch:
    inputs:
      public_key:
        description: Ephemeral RSA-3072 public key as base64 DER; never paste a private key
        required: true
        type: string
permissions: {}
concurrency:
  group: personal-morning-paper
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'itworksinprod/first-fold' && github.ref == 'refs/heads/main' && github.actor == 'itworksinprod' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Test contracts before using credentials
        run: npm test
      - name: Validate the ephemeral public key before credentials
        env:
          DIAGNOSTIC_PUBLIC_KEY: ${{ inputs.public_key }}
        run: node --input-type=module -e 'import { validatePrivateEditorialDiagnosticKey } from "./scripts/automation/private-editorial-diagnostic.mjs"; validatePrivateEditorialDiagnosticKey(process.env.DIAGNOSTIC_PUBLIC_KEY);'
      - name: Research and inspect bounded drafts without sending
        env:
          DIAGNOSTIC_PUBLIC_KEY: ${{ inputs.public_key }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
          CLOUDFLARE_AI_MODEL: '@cf/meta/llama-3.3-70b-instruct-fp8-fast'
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TAVILY_PAYGO_DISABLED_VERIFIED: ${{ vars.TAVILY_PAYGO_DISABLED_VERIFIED }}
        run: node scripts/automation/check-personal-quality.mjs --require-web-search --reasoning-pipeline --private-diagnostic
      - name: Retain only encrypted editorial checkpoints for one day
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: private-editorial-checkpoints
          path: ${{ runner.temp }}/private-editorial-checkpoints.encrypted.json
          retention-days: 1
          if-no-files-found: ignore
