name: Verify Anthropic article reader (no email)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/article-reader-check.yml'
      - 'scripts/automation/check-anthropic-reader.mjs'
      - 'scripts/automation/free/article-evidence.mjs'
      - 'scripts/automation/free/publisher-registry.mjs'
      - 'tests/anthropic-article.test.mjs'
      - 'scripts/automation/check-anthropic-facts.mjs'
      - 'docs/checkpoints/anthropic-fact-sheet.json'
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test reader regressions
        run: node --test tests/anthropic-article.test.mjs tests/article-evidence.test.mjs tests/search-articles.test.mjs
      - name: Verify live publisher extraction
        run: node scripts/automation/check-anthropic-reader.mjs
      - name: Verify reviewed fact sheet evidence binding
        run: node scripts/automation/check-anthropic-facts.mjs
