name: Revise reviewed private draft (no email)
on:
  workflow_dispatch:
    inputs:
      test_id:
        description: Exact short-lived test ID from the reviewed revision manifest
        required: true
        type: string
      free_project_confirmation:
        description: Confirm AI Studio shows Free; enter FREE PROJECT BILLING DISABLED
        required: true
        type: string
permissions: {}
concurrency:
  group: gemini-writer-qualification
  cancel-in-progress: false
jobs:
  revision:
    if: >-
      github.repository == 'itworksinprod/first-fold' &&
      github.ref == 'refs/heads/main' && github.actor == 'itworksinprod' &&
      github.triggering_actor == 'itworksinprod' && github.run_attempt == 1 &&
      inputs.free_project_confirmation == 'FREE PROJECT BILLING DISABLED'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Test revision boundaries before credentials
        run: npm test
      - name: Verify pinned ciphertext and expiry before credentials
        env:
          REVIEWED_REVISION_TEST_ID: ${{ inputs.test_id }}
        run: node scripts/automation/revise-reviewed-preview.mjs --validate-only
      - name: One source-bound revision per story without delivery
        env:
          REVIEWED_REVISION_TEST_ID: ${{ inputs.test_id }}
          GEMINI_FREE_PROJECT_CONFIRMATION: ${{ inputs.free_project_confirmation }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIRST_FOLD_REVIEWED_TEST_KEY: ${{ secrets.FIRST_FOLD_REVIEWED_TEST_KEY }}
        run: node scripts/automation/revise-reviewed-preview.mjs --human-review-only "$RUNNER_TEMP/reviewed-revision.encrypted.json"
      - name: Retain only encrypted revision evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-revision-encrypted
          path: ${{ runner.temp }}/reviewed-revision.encrypted.json
          retention-days: 1
          if-no-files-found: ignore
