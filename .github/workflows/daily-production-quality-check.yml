name: Check daily production paper (no email)
# Exercises the unchanged daily generator and reviewer. No preview-model promotion.
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: personal-morning-paper
  cancel-in-progress: false
jobs:
  check:
    if: >-
      github.repository == 'itworksinprod/first-fold' &&
      github.ref == 'refs/heads/main' && github.actor == 'itworksinprod' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Test before credentials
        run: npm test
      - name: Research and require three checked summaries without sending
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TAVILY_PAYGO_DISABLED_VERIFIED: ${{ vars.TAVILY_PAYGO_DISABLED_VERIFIED }}
        run: node scripts/automation/check-personal-quality.mjs --daily-production
