name: Diagnose one free writer story (encrypted, no email)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Source tests daily writer; source-recheck tests provisional claims; review-controls tests synthetic facts; provider-only checks availability
        required: false
        default: source
        type: choice
        options:
          - source
          - source-recheck
          - source-recheck-explicit
          - source-field-review
          - review-controls
          - explicit-review-controls
          - split-review-controls
          - isolated-review-controls
          - field-review-controls
          - provider-only
          - reviewed-fact-summary
          - causal-review-controls
          - claimwise-review-controls
          - claimwise-fact-summary
          - generic-second-article
          - plain-language-second-article
          - sentence-language-second-article
          - frozen-sentence-language
          - frozen-definition-language
          - frozen-vocabulary-language
          - frozen-reasoning-language
          - saved-final-review
          - preservation-review-controls
          - split-preservation-review-controls
          - isolated-preservation-controls
          - isolated-preservation-holdouts
          - text-preservation-controls
          - text-preservation-holdouts
          - text-preservation-paraphrase
          - definition-preservation-controls
          - grammar-preservation-controls
          - grammar-reasoning-controls
          - grammar-reasoning-holdouts
          - context-assisted-language
          - context-direct-language
          - context-direct-unit-language
          - context-named-unit-language
          - context-two-unit-repair
          - context-two-unit-plain-repair
          - context-complete-repair
          - context-span-repair
          - context-final-phrase-repair
          - saved-useful-significance
          - saved-meaningful-watch
      public_key:
        description: Ephemeral RSA-3072 public key in base64 DER format (never a private key)
        required: true
        type: string
permissions: {}
concurrency:
  group: personal-morning-paper
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'itworksinprod/first-fold' && github.ref == 'refs/heads/main' && github.actor == 'itworksinprod' && github.run_attempt == 1
    runs-on: ubuntu-latest
    # The 22-call definition control set allows 30 seconds per request plus
    # credential-free setup and artifact upload. The 11-call grammar modes get 10
    # minutes; all other modes retain their existing 8-minute limit.
    timeout-minutes: ${{ inputs.mode == 'definition-preservation-controls' && 15 || (inputs.mode == 'grammar-preservation-controls' || inputs.mode == 'grammar-reasoning-controls' || inputs.mode == 'grammar-reasoning-holdouts') && 10 || 8 }}
    permissions:
      contents: read
    steps:
      # The isolated reviewer modes retain the same credential-free setup and
      # encrypted artifact path as other diagnostics; no delivery permission.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Test diagnostic boundaries before using credentials
        run: node --test tests/split-preservation-review.test.mjs tests/preservation-review-diagnostic.test.mjs tests/claimwise-review.test.mjs tests/copyedit-preservation-review.test.mjs tests/causal-review.test.mjs tests/fact-summary-diagnostic.test.mjs tests/single-phrase-copyedit.test.mjs tests/phrase-copyedit.test.mjs tests/phrase-copyedit-catalog.test.mjs tests/phrase-copyedit-context.test.mjs tests/copyedit-qualification-guard.test.mjs tests/private-writer-diagnostic.test.mjs tests/reviewer-transport-diagnostic.test.mjs tests/split-claim-review.test.mjs tests/foundation-recheck.test.mjs tests/grounded-draft.test.mjs tests/free-workers-ai.test.mjs
      - name: Test isolated source and preservation boundaries before credentials
        run: node --test tests/isolated-preservation-review.test.mjs tests/isolated-preservation-diagnostic.test.mjs tests/text-preservation-review.test.mjs tests/text-preservation-diagnostic.test.mjs
      - name: Test definition-aware reviewer boundaries before credentials
        run: node --test tests/definition-preservation.test.mjs tests/definition-preservation-diagnostic.test.mjs
      - name: Test synthetic grammar reviewer boundaries before credentials
        run: node --test tests/grammar-preservation-cases.test.mjs tests/grammar-preservation-diagnostic.test.mjs tests/meaning-holdout-cases.test.mjs
      - name: Test isolated sentence rewriting before credentials
        run: node --test tests/sentence-language-rewrite.test.mjs tests/sentence-language-diagnostic.test.mjs
      - name: Test frozen-baseline boundaries before credentials
        run: node --test tests/frozen-fact-baseline.test.mjs tests/frozen-sentence-diagnostic.test.mjs tests/qualified-definition-review.test.mjs tests/definition-fluency-prompt.test.mjs tests/definition-context.test.mjs tests/definition-integration-prompt.test.mjs tests/definition-composition-prompt.test.mjs tests/definition-polish-prompt.test.mjs tests/editorial-vocabulary.test.mjs
      - name: Test saved final-review boundaries before credentials
        run: node --test tests/saved-final-review-diagnostic.test.mjs
      - name: Test context editor boundaries before credentials
        run: node --test tests/context-editor-profile.test.mjs tests/frozen-sentence-diagnostic.test.mjs tests/direct-definition-editor.test.mjs tests/unit-meaning-review.test.mjs tests/sentence-repair-profile.test.mjs tests/repair-span-contract.test.mjs
      - name: Test one-sentence significance boundaries before credentials
        run: node --test tests/significance-introduction.test.mjs tests/significance-diagnostic.test.mjs
      - name: Test editorial watch-question boundaries before credentials
        run: node --test tests/watch-question.test.mjs tests/watch-diagnostic.test.mjs
      - name: Validate diagnostic mode and encryption before credentials
        env:
          FIRST_FOLD_WATCH_BASELINE_B64: ${{ inputs.mode == 'saved-meaningful-watch' && secrets.FIRST_FOLD_WATCH_BASELINE_B64 || '' }}
          FIRST_FOLD_SIGNIFICANCE_BASELINE_B64: ${{ inputs.mode == 'saved-useful-significance' && secrets.FIRST_FOLD_SIGNIFICANCE_BASELINE_B64 || '' }}
          FIRST_FOLD_CONTEXT_EDITOR_PACKET_B64: ${{ (inputs.mode == 'context-final-phrase-repair' || inputs.mode == 'context-assisted-language' || inputs.mode == 'context-direct-language' || inputs.mode == 'context-direct-unit-language' || inputs.mode == 'context-named-unit-language' || inputs.mode == 'context-two-unit-repair' || inputs.mode == 'context-two-unit-plain-repair' || inputs.mode == 'context-complete-repair' || inputs.mode == 'context-span-repair') && secrets.FIRST_FOLD_CONTEXT_EDITOR_PACKET_B64 || '' }}
          FIRST_FOLD_SENTENCE_REPAIR_B64: ${{ inputs.mode == 'context-final-phrase-repair' && secrets.FIRST_FOLD_FINAL_PHRASE_REPAIR_B64 || (inputs.mode == 'context-two-unit-repair' || inputs.mode == 'context-two-unit-plain-repair' || inputs.mode == 'context-complete-repair' || inputs.mode == 'context-span-repair') && secrets.FIRST_FOLD_SENTENCE_REPAIR_B64 || '' }}
          DIAGNOSTIC_PUBLIC_KEY: ${{ inputs.public_key }}
          PRIVATE_WRITER_DIAGNOSTIC_MODE: ${{ inputs.mode || 'source' }}
          FIRST_FOLD_FROZEN_BASELINE_B64: ${{ (inputs.mode == 'frozen-sentence-language' || inputs.mode == 'frozen-definition-language' || inputs.mode == 'frozen-vocabulary-language' || inputs.mode == 'frozen-reasoning-language') && secrets.FIRST_FOLD_FROZEN_BASELINE_B64 || '' }}
          FIRST_FOLD_FINAL_REVIEW_PACKET_B64: ${{ inputs.mode == 'saved-final-review' && secrets.FIRST_FOLD_FINAL_REVIEW_PACKET_B64 || '' }}
        run: node scripts/automation/private-writer-diagnostic.mjs validate
      - name: Inspect the selected bounded diagnostic without delivery
        env:
          FIRST_FOLD_WATCH_BASELINE_B64: ${{ inputs.mode == 'saved-meaningful-watch' && secrets.FIRST_FOLD_WATCH_BASELINE_B64 || '' }}
          FIRST_FOLD_SIGNIFICANCE_BASELINE_B64: ${{ inputs.mode == 'saved-useful-significance' && secrets.FIRST_FOLD_SIGNIFICANCE_BASELINE_B64 || '' }}
          FIRST_FOLD_CONTEXT_EDITOR_PACKET_B64: ${{ (inputs.mode == 'context-final-phrase-repair' || inputs.mode == 'context-assisted-language' || inputs.mode == 'context-direct-language' || inputs.mode == 'context-direct-unit-language' || inputs.mode == 'context-named-unit-language' || inputs.mode == 'context-two-unit-repair' || inputs.mode == 'context-two-unit-plain-repair' || inputs.mode == 'context-complete-repair' || inputs.mode == 'context-span-repair') && secrets.FIRST_FOLD_CONTEXT_EDITOR_PACKET_B64 || '' }}
          FIRST_FOLD_SENTENCE_REPAIR_B64: ${{ inputs.mode == 'context-final-phrase-repair' && secrets.FIRST_FOLD_FINAL_PHRASE_REPAIR_B64 || (inputs.mode == 'context-two-unit-repair' || inputs.mode == 'context-two-unit-plain-repair' || inputs.mode == 'context-complete-repair' || inputs.mode == 'context-span-repair') && secrets.FIRST_FOLD_SENTENCE_REPAIR_B64 || '' }}
          DIAGNOSTIC_PUBLIC_KEY: ${{ inputs.public_key }}
          PRIVATE_WRITER_DIAGNOSTIC_MODE: ${{ inputs.mode || 'source' }}
          FIRST_FOLD_FROZEN_BASELINE_B64: ${{ (inputs.mode == 'frozen-sentence-language' || inputs.mode == 'frozen-definition-language' || inputs.mode == 'frozen-vocabulary-language' || inputs.mode == 'frozen-reasoning-language') && secrets.FIRST_FOLD_FROZEN_BASELINE_B64 || '' }}
          FIRST_FOLD_FINAL_REVIEW_PACKET_B64: ${{ inputs.mode == 'saved-final-review' && secrets.FIRST_FOLD_FINAL_REVIEW_PACKET_B64 || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
        run: node scripts/automation/private-writer-diagnostic.mjs run "$RUNNER_TEMP/writer-diagnostic.encrypted.json"
      - name: Retain only encrypted diagnostic for one day
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: private-writer-diagnostic
          path: ${{ runner.temp }}/writer-diagnostic.encrypted.json
          retention-days: 1
          if-no-files-found: ignore
