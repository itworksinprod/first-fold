name: Diagnose one free writer story (encrypted, no email)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Source tests daily writer; source-recheck tests provisional claims; review-controls tests synthetic facts; provider-only checks availability
        required: false
        default: source
        type: choice
        options:
          - source
          - source-recheck
          - source-recheck-explicit
          - source-field-review
          - review-controls
          - explicit-review-controls
          - split-review-controls
          - isolated-review-controls
          - field-review-controls
          - provider-only
          - reviewed-fact-summary
          - causal-review-controls
          - claimwise-review-controls
          - claimwise-fact-summary
          - generic-second-article
          - plain-language-second-article
          - sentence-language-second-article
          - frozen-sentence-language
          - frozen-definition-language
          - preservation-review-controls
          - split-preservation-review-controls
          - isolated-preservation-controls
          - isolated-preservation-holdouts
          - text-preservation-controls
          - text-preservation-holdouts
          - text-preservation-paraphrase
          - definition-preservation-controls
      public_key:
        description: Ephemeral RSA-3072 public key in base64 DER format (never a private key)
        required: true
        type: string
permissions: {}
concurrency:
  group: personal-morning-paper
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'itworksinprod/first-fold' && github.ref == 'refs/heads/main' && github.actor == 'itworksinprod' && github.run_attempt == 1
    runs-on: ubuntu-latest
    # The 22-call definition control set allows 30 seconds per request plus
    # credential-free setup and artifact upload. All earlier modes stay at 8.
    timeout-minutes: ${{ inputs.mode == 'definition-preservation-controls' && 15 || 8 }}
    permissions:
      contents: read
    steps:
      # The isolated reviewer modes retain the same credential-free setup and
      # encrypted artifact path as other diagnostics; no delivery permission.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Test diagnostic boundaries before using credentials
        run: node --test tests/split-preservation-review.test.mjs tests/preservation-review-diagnostic.test.mjs tests/claimwise-review.test.mjs tests/copyedit-preservation-review.test.mjs tests/causal-review.test.mjs tests/fact-summary-diagnostic.test.mjs tests/single-phrase-copyedit.test.mjs tests/phrase-copyedit.test.mjs tests/phrase-copyedit-catalog.test.mjs tests/phrase-copyedit-context.test.mjs tests/copyedit-qualification-guard.test.mjs tests/private-writer-diagnostic.test.mjs tests/reviewer-transport-diagnostic.test.mjs tests/split-claim-review.test.mjs tests/foundation-recheck.test.mjs tests/grounded-draft.test.mjs tests/free-workers-ai.test.mjs
      - name: Test isolated source and preservation boundaries before credentials
        run: node --test tests/isolated-preservation-review.test.mjs tests/isolated-preservation-diagnostic.test.mjs tests/text-preservation-review.test.mjs tests/text-preservation-diagnostic.test.mjs
      - name: Test definition-aware reviewer boundaries before credentials
        run: node --test tests/definition-preservation.test.mjs tests/definition-preservation-diagnostic.test.mjs
      - name: Test isolated sentence rewriting before credentials
        run: node --test tests/sentence-language-rewrite.test.mjs tests/sentence-language-diagnostic.test.mjs
      - name: Test frozen-baseline boundaries before credentials
        run: node --test tests/frozen-fact-baseline.test.mjs tests/frozen-sentence-diagnostic.test.mjs tests/qualified-definition-review.test.mjs tests/definition-fluency-prompt.test.mjs tests/definition-context.test.mjs tests/definition-integration-prompt.test.mjs
      - name: Validate diagnostic mode and encryption before credentials
        env:
          DIAGNOSTIC_PUBLIC_KEY: ${{ inputs.public_key }}
          PRIVATE_WRITER_DIAGNOSTIC_MODE: ${{ inputs.mode || 'source' }}
          FIRST_FOLD_FROZEN_BASELINE_B64: ${{ (inputs.mode == 'frozen-sentence-language' || inputs.mode == 'frozen-definition-language') && secrets.FIRST_FOLD_FROZEN_BASELINE_B64 || '' }}
        run: node scripts/automation/private-writer-diagnostic.mjs validate
      - name: Inspect the selected bounded diagnostic without delivery
        env:
          DIAGNOSTIC_PUBLIC_KEY: ${{ inputs.public_key }}
          PRIVATE_WRITER_DIAGNOSTIC_MODE: ${{ inputs.mode || 'source' }}
          FIRST_FOLD_FROZEN_BASELINE_B64: ${{ (inputs.mode == 'frozen-sentence-language' || inputs.mode == 'frozen-definition-language') && secrets.FIRST_FOLD_FROZEN_BASELINE_B64 || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
        run: node scripts/automation/private-writer-diagnostic.mjs run "$RUNNER_TEMP/writer-diagnostic.encrypted.json"
      - name: Retain only encrypted diagnostic for one day
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: private-writer-diagnostic
          path: ${{ runner.temp }}/writer-diagnostic.encrypted.json
          retention-days: 1
          if-no-files-found: ignore
